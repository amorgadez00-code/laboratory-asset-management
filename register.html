<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<form id="registerForm">

<label>Full Name</label>

<input
type="text"
id="fullName"
required
>

<label>Email</label>

<input
type="email"
id="email"
required
>

<label>Password</label>

<input
type="password"
id="password"
required
minlength="6"
>

<button type="submit">
Register
</button>

</form>

<p id="message"></p>

</div>


<script type="module">

import {
    supabase
}
from "./js/supabase.js";


const form =
document.getElementById(
    "registerForm"
);


form.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const fullName =
    document.getElementById(
        "fullName"
    ).value;

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;


    const { data, error } =
    await supabase.auth.signUp({

        email: email,

        password: password,

        options: {

            data: {

                full_name: fullName

            }

        }

    });


    if (error) {

        document.getElementById(
            "message"
        ).textContent =
        error.message;

        return;
    }


    document.getElementById(
        "message"
    ).textContent =
    "Registration successful. You can now login.";

});

</script>

</body>

</html>
