<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>


<script type="module">

import { supabase }
from "./js/supabase.js";


const form =
document.getElementById("loginForm");


form.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;


    const { data, error } =
    await supabase.auth.signInWithPassword({

        email: email,

        password: password

    });


    if (error) {

        document.getElementById("message")
        .textContent =
        error.message;

        return;
    }


    window.location.href =
    "dashboard.html";

});

</script>

</body>

</html>
